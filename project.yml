name: Cinema

options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  # libmpv for iOS: plays MKV, HEVC, Dolby Vision/HDR, multiple audio tracks and subtitles.
  MPVKit:
    url: https://github.com/mpvkit/MPVKit
    exactVersion: 1.1.0-n9.0.2

targets:
  Cinema:
    type: application
    platform: iOS
    sources:
      - path: Cinema
      - path: Shared
    dependencies:
      - package: MPVKit
        product: MPVKit
      # The Home Screen widget, embedded in the app.
      - target: CinemaWidget
    entitlements:
      path: Cinema/Resources/Cinema.entitlements
      properties:
        # Shared with the widget. A signing service may remove this; the widget then shows "Start Watching".
        com.apple.security.application-groups: [group.com.personal.cinema]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.cinema
        PRODUCT_NAME: Cinema
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The styles under Settings → Appearance → App Icon.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Light AppIcon-Dark AppIcon-Gold AppIcon-Neon AppIcon-Terminal AppIcon-Retro AppIcon-Aqua"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: Cinema/Resources/Info.plist
    info:
      path: Cinema/Resources/Info.plist
      properties:
        CFBundleDisplayName: Cinema
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ar]
        CFBundleAllowMixedLocalizations: true
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        # A launch screen is what tells iOS the app supports every modern iPhone size.
        # Without it, iOS runs the app letterboxed in a legacy compatibility mode.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageRespectsSafeAreaInsets: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Picture in Picture, AirPlay and Lock Screen controls keep playing in the background.
        UIBackgroundModes: [audio]
        # Personal addons are sometimes self-hosted on plain HTTP (e.g. on a home network).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Cinema connects to addons you host on your local network.
        NSFaceIDUsageDescription: Cinema uses Face ID to unlock locked profiles.
        # cinema://continue?key=… from the widget resumes a title.
        CFBundleURLTypes:
          - CFBundleURLName: com.personal.cinema
            CFBundleURLSchemes: [cinema]

  CinemaWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: CinemaWidget
      - path: Shared
    entitlements:
      path: CinemaWidget/CinemaWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.personal.cinema]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.cinema.widget
        PRODUCT_NAME: CinemaWidget
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: CinemaWidget/Info.plist
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        SKIP_INSTALL: YES
    info:
      path: CinemaWidget/Info.plist
      properties:
        CFBundleDisplayName: Cinema
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ar]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  CinemaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CinemaTests
    dependencies:
      - target: Cinema
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.cinema.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Cinema.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Cinema
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Cinema:
    build:
      targets:
        Cinema: all
        CinemaTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - CinemaTests
    archive:
      config: Release
