name: Build IPA

# Builds only when code lands on main, or when started by hand from the
# Actions tab ("Run workflow"). macOS minutes are limited, so feature
# branches and pull requests don't build automatically.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # Needed to create the GitHub Release that publishes Cinema.ipa.
  contents: write

env:
  # Every build gets the next number automatically: 0.1.7, 0.1.8, ...
  APP_VERSION: 0.1.${{ github.run_number }}
  BUILD_NUMBER: ${{ github.run_number }}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test & build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              return [int(n) for n in re.findall(r"\d+", runtime.split("iOS")[-1])]
          for runtime in sorted((r for r in devices if "iOS" in r), key=version, reverse=True):
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"]); sys.exit(0)
          sys.exit("No iPhone simulator found")
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Cinema.xcodeproj \
            -scheme Cinema \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            | tee build-test.log | grep -E "error:|warning: |Test Case .* (passed|failed)|Executed|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build-test.log

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Cinema.xcodeproj \
            -scheme Cinema \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Cinema.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | tee build-archive.log | grep -E "error:|\*\* ARCHIVE" || true
          grep -q "\*\* ARCHIVE SUCCEEDED \*\*" build-archive.log

      - name: Package Cinema.ipa
        run: |
          APP=build/Cinema.xcarchive/Products/Applications/Cinema.app
          test -d "$APP"
          rm -rf Payload Cinema.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Cinema.ipa Payload
          ls -lh Cinema.ipa

      - name: Verify full-screen support
        # Without UILaunchScreen iOS letterboxes the app, so fail loudly if it's missing.
        run: |
          plutil -extract UILaunchScreen xml1 -o - Payload/Cinema.app/Info.plist
          plutil -extract UIDeviceFamily xml1 -o - Payload/Cinema.app/Info.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cinema-ipa
          path: Cinema.ipa
          if-no-files-found: error

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build-*.log
          if-no-files-found: ignore

      - name: Publish GitHub Release
        # Only builds of main become releases. The .ipa is attached directly
        # (not zipped), so it downloads straight to the iPhone.
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$APP_VERSION"
          SUBJECT=$(git log -1 --pretty=%s)
          {
            echo "**Cinema $APP_VERSION** (build $BUILD_NUMBER)"
            echo
            echo "$SUBJECT"
            echo
            echo "Download **Cinema.ipa** below, then sign and install it."
          } > release-notes.md
          gh release create "$TAG" Cinema.ipa \
            --title "Cinema $APP_VERSION" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA" \
            --latest
